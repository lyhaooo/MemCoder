[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memcoder-agent"
version = "0.1.0"
description = "A memory-augmented coding agent with an auditable LangGraph workflow."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MemCoder contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
memcoder = "memcoder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/memcoder"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

